name: Test

env:
  PYTHONUNBUFFERED: "1"

# Newer commits cancel superseded runs on the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run the build."
        required: false
        default: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      mode: ${{ steps.plan.outputs.mode }}
      depcheck_packages: ${{ steps.plan.outputs.depcheck_packages }}
      jest_cache_key: ${{ steps.jest-cache-key.outputs.key }}

    steps:
      - uses: actions/checkout@v4
        with:
          # A PR merge commit and its parents suffice for base...HEAD planning.
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '1' }}

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Compute Jest cache key
        id: jest-cache-key
        run: node src/scripts/ci-jest-cache-key.mjs --github-output

      - name: Plan test lanes
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cd src
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Fail closed if the event base is outside the shallow checkout.
            if ! git merge-base --is-ancestor "$PR_BASE_SHA" HEAD 2>/dev/null; then
              git fetch --no-tags --unshallow origin
            fi
            node scripts/ci-test-plan.mjs --base="$PR_BASE_SHA" --github-output --pretty
          else
            node scripts/ci-test-plan.mjs --full --github-output --pretty
          fi

  build:
    needs: plan
    if: needs.plan.outputs.has_tests == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/packages/pnpm-lock.yaml

      - name: Build
        run: cd src && pnpm build

      - name: Pack workspace build
        run: |
          cd src
          mapfile -d '' build_dirs < <(
            find packages \
              -type d -name node_modules -prune -o \
              -type d \( -name dist -o -name dist-ts \) -print0
          )
          if (( ${#build_dirs[@]} == 0 )); then
            echo "No workspace build directories found."
            exit 1
          fi
          mapfile -d '' test_tools < <(
            find packages/backend/node_modules/.bin \
              -maxdepth 1 -type f ! -name codex -print0
          )
          tar --create --file workspace-build.tar \
            "${build_dirs[@]}" \
            "${test_tools[@]}"

      - name: Upload workspace build
        uses: actions/upload-artifact@v4
        with:
          name: workspace-build
          path: src/workspace-build.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  checks:
    needs: plan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/packages/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm -C src/packages install --frozen-lockfile

      - name: Static checks
        run: pnpm -C src test:checks

      - name: Dependency checks
        env:
          DEPCHECK_PACKAGES: ${{ needs.plan.outputs.depcheck_packages }}
          TEST_MODE: ${{ needs.plan.outputs.mode }}
        run: |
          cd src
          if [[ "$TEST_MODE" == "full" ]]; then
            pnpm depcheck
          elif [[ -n "$DEPCHECK_PACKAGES" ]]; then
            ./workspaces.py pnpm --packages="$DEPCHECK_PACKAGES" --parallel run depcheck
          else
            echo "No directly changed package requires depcheck."
          fi

  test:
    needs: [plan, build]
    if: needs.plan.outputs.has_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/packages/pnpm-lock.yaml

      - name: Install system packages
        run: |
          APT_RETRY=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
          )
          sudo timeout 3m apt-get "${APT_RETRY[@]}" update
          sudo timeout 3m apt-get "${APT_RETRY[@]}" install -y attr btrfs-progs python3

      - name: Install workspace dependencies
        run: pnpm -C src/packages install --frozen-lockfile

      - name: Download workspace build
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: src

      - name: Extract workspace build
        run: tar --extract --file src/workspace-build.tar --directory src

      - name: Cache Jest transforms
        uses: actions/cache@v4
        with:
          path: src/.cache/jest
          # Jest hashes each source file itself. Reuse one immutable baseline
          # per compiler/configuration and lane instead of copying it per commit.
          key: jest-v2-${{ runner.os }}-node24-${{ needs.plan.outputs.jest_cache_key }}-${{ matrix.lane }}
          # These also restore the older commit-suffixed and unsplit caches.
          restore-keys: |
            jest-v2-${{ runner.os }}-node24-${{ needs.plan.outputs.jest_cache_key }}-${{ matrix.lane }}-
            jest-v2-${{ runner.os }}-node24-${{ needs.plan.outputs.jest_cache_key }}-${{ matrix.cache_fallback_lane || matrix.lane }}-

      - name: Cache pip
        if: matrix.lane == 'rest'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3-${{ hashFiles('src/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3-

      - name: Set up Python venv and Jupyter kernel
        if: matrix.lane == 'rest'
        run: |
          python3 -m pip install --upgrade pip virtualenv
          python3 -m virtualenv venv
          source venv/bin/activate
          pip install ipykernel requests yapf
          python -m ipykernel install --prefix=./jupyter-local --name python3-local --display-name "Python 3 (Local)"

      - name: Check Essential frontend bundle budgets
        if: matrix.lane == 'rest'
        run: cd src/packages/static && pnpm run check-ultralite-budgets

      - name: Test ${{ matrix.lane }} packages
        env:
          COCALC_RUNTIME_STORAGE_ALLOW_DIRECT: "yes"
          COCALC_TEST_REPORT_DIR: ${{ github.workspace }}/src/.cache/test-reports
          TEST_PACKAGES: ${{ matrix.packages }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          if [[ "${{ matrix.lane }}" == "rest" ]]; then
            source venv/bin/activate
          fi
          cd src
          test_args=(--packages="$TEST_PACKAGES")
          if [[ -n "$TEST_SHARD" ]]; then
            test_args+=(--shard="$TEST_SHARD")
          fi
          ./workspaces.py test "${test_args[@]}"

      - name: Upload test attempts and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.lane }}
          path: src/.cache/test-reports
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # A real two-bay cluster (seed + attached bay), each a full hub with its own
  # PostgreSQL, joined by the real inter-bay fabric, plus fault injection.
  # Multibay is not deployed yet; this keeps it working until it is.
  multibay:
    needs: [plan, build]
    if: needs.plan.outputs.has_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/packages/pnpm-lock.yaml

      - name: PostgreSQL server binaries
        run: |
          # Each bay starts its own embedded PostgreSQL; the image ships the
          # server, just not on PATH.
          bindir="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)"
          test -x "$bindir/initdb"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Install workspace dependencies
        run: pnpm -C src/packages install --frozen-lockfile

      - name: Download workspace build
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: src

      - name: Extract workspace build
        run: tar --extract --file src/workspace-build.tar --directory src

      - name: Two-bay cluster tests
        env:
          MULTIBAY_DIR: /tmp/multibay
          MULTIBAY_KEEP: "1"
        run: |
          mkdir -p "$MULTIBAY_DIR"
          node --test --test-reporter=spec src/scripts/multibay/fuzz/model.test.mjs src/scripts/multibay/multibay.test.mjs

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multibay-logs
          path: |
            /tmp/multibay/*/bay-*/*.log
          if-no-files-found: warn
          retention-days: 7
