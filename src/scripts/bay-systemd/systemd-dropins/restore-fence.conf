# Installed for every bay unit (cocalc-bay.target and the cocalc-bay-*
# services, timers and targets). While /etc/cocalc/bay-restore-fence exists,
# none of them starts, also not at boot or by a Restart= or a timer: a bay
# that is being restored, or rebuilt on a new VM, must not run, serve the
# tunnel or write backups until bay-restore has put verified data in place.
# See RESTORE.md.
[Unit]
ConditionPathExists=!/etc/cocalc/bay-restore-fence
