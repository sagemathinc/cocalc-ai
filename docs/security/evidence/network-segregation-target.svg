<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
  <title id="title">CoCalc target network segregation architecture</title>
  <desc id="desc">Target architecture showing separate GCP projects and VPCs for production core services, user dedicated VMs, operations, and development and staging. Public CoCalc ingress passes through Cloudflare. Dedicated VMs have public Internet connectivity but no east-west or cross-project private connectivity.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#12201c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#315e54"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#cc6819"/>
    </marker>
    <style>
      .canvas { fill: #f3f5f0; }
      .eyebrow { font: 700 16px 'Segoe UI', sans-serif; letter-spacing: 2.6px; fill: #567068; }
      .title { font: 750 40px 'Segoe UI', sans-serif; fill: #14251f; }
      .subtitle { font: 400 19px 'Segoe UI', sans-serif; fill: #53665f; }
      .section { font: 700 15px 'Segoe UI', sans-serif; letter-spacing: 2px; fill: #5e716b; }
      .card-title { font: 700 22px 'Segoe UI', sans-serif; fill: #172a24; }
      .card-subtitle { font: 600 15px 'Segoe UI', sans-serif; letter-spacing: 0.8px; fill: #65766f; }
      .body { font: 400 16px 'Segoe UI', sans-serif; fill: #384c45; }
      .body-bold { font: 650 16px 'Segoe UI', sans-serif; fill: #273d36; }
      .small { font: 400 14px 'Segoe UI', sans-serif; fill: #53665f; }
      .tiny { font: 500 12.5px 'Segoe UI', sans-serif; fill: #60736c; }
      .white-title { font: 700 21px 'Segoe UI', sans-serif; fill: #ffffff; }
      .white-small { font: 500 14px 'Segoe UI', sans-serif; fill: #f6fbf8; }
      .flow-label { font: 650 13px 'Segoe UI', sans-serif; fill: #315e54; }
      .flow { fill: none; stroke: #315e54; stroke-width: 3; marker-end: url(#arrow); }
      .flow-dashed { fill: none; stroke: #315e54; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .flow-orange { fill: none; stroke: #cc6819; stroke-width: 3; marker-end: url(#arrowOrange); }
      .divider { stroke: #d5ddd8; stroke-width: 1.5; }
      .deny { stroke: #bc3e38; stroke-width: 3; stroke-linecap: round; }
      .deny-label { font: 700 13px 'Segoe UI', sans-serif; fill: #a5322e; letter-spacing: 0.4px; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1300"/>
  <circle cx="1645" cy="-30" r="250" fill="#dceae4" opacity="0.75"/>
  <circle cx="40" cy="1230" r="210" fill="#f4dfc9" opacity="0.55"/>

  <text x="64" y="54" class="eyebrow">SOC 2 • NETWORK SEGREGATION</text>
  <text id="diagram-heading" x="64" y="102" class="title">CoCalc Network Segregation — Target Architecture</text>
  <text x="64" y="136" class="subtitle">Independent cloud projects and VPCs isolate production, dedicated compute, operations, and non-production.</text>

  <g filter="url(#shadow)">
    <rect x="1352" y="36" width="382" height="92" rx="16" fill="#fff6e7" stroke="#d27a2b" stroke-width="2"/>
    <rect x="1352" y="36" width="11" height="92" rx="5" fill="#d27a2b"/>
    <text x="1382" y="68" class="card-subtitle" fill="#985019">TARGET STATE • 2026-08-13</text>
    <text x="1382" y="94" class="small">Pending: staging → cocalc-dev</text>
    <text x="1382" y="116" class="small">and alpha.cocalc.ai → cocalc-ops</text>
  </g>

  <!-- External and corporate endpoints -->
  <g filter="url(#shadow)">
    <rect x="58" y="184" width="312" height="790" rx="24" fill="#ffffff" stroke="#d4ddd7" stroke-width="2"/>
  </g>
  <text x="88" y="222" class="section">EXTERNAL / CORPORATE</text>

  <g>
    <rect x="88" y="260" width="252" height="130" rx="18" fill="#edf6f2" stroke="#a9c8bc" stroke-width="1.5"/>
    <circle cx="124" cy="301" r="20" fill="#2d685a"/>
    <circle cx="124" cy="294" r="6" fill="#ffffff"/>
    <path d="M113 313 Q124 301 135 313" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="158" y="298" class="card-title">End users</text>
    <text x="108" y="340" class="body">Browser, CLI, API</text>
    <text x="108" y="365" class="small">No trusted private network route</text>
  </g>

  <g>
    <rect x="88" y="438" width="252" height="150" rx="18" fill="#edf2f8" stroke="#afc1d7" stroke-width="1.5"/>
    <circle cx="124" cy="479" r="20" fill="#335e82"/>
    <path d="M116 480 l6 6 12 -15" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="158" y="477" class="card-title">Operators</text>
    <text x="108" y="519" class="body">Authorized admin endpoints</text>
    <text x="108" y="544" class="small">MFA + scoped credentials</text>
    <text x="108" y="567" class="small">No corporate/VPN peering</text>
  </g>

  <g>
    <rect x="88" y="662" width="252" height="156" rx="18" fill="#fff5e8" stroke="#e4bb8b" stroke-width="1.5"/>
    <circle cx="124" cy="704" r="20" fill="#bd641f"/>
    <rect x="114" y="696" width="20" height="15" rx="2" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M119 716 h10" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="158" y="702" class="card-title">VM owners</text>
    <text x="108" y="744" class="body">CoCalc UI for lifecycle</text>
    <text x="108" y="769" class="small">Direct SSH to dedicated IP</text>
    <text x="108" y="793" class="small">Internet endpoint, not prod VPC</text>
  </g>

  <g>
    <rect x="88" y="866" width="252" height="76" rx="14" fill="#f8faf8" stroke="#d5ddd8"/>
    <text x="108" y="896" class="body-bold">Trust model</text>
    <text x="108" y="921" class="small">Public, authenticated entry only</text>
  </g>

  <!-- Public edge -->
  <g filter="url(#shadow)">
    <rect x="410" y="184" width="320" height="790" rx="24" fill="#fffdf9" stroke="#ead8c4" stroke-width="2"/>
  </g>
  <text x="440" y="222" class="section">PUBLIC EDGE / CONTROL APIS</text>

  <g>
    <rect x="440" y="260" width="260" height="330" rx="20" fill="#ffffff" stroke="#ef9b52" stroke-width="2"/>
    <rect x="440" y="260" width="260" height="80" rx="20" fill="#d87524"/>
    <path d="M440 320 H700 V340 H440 Z" fill="#d87524"/>
    <circle cx="478" cy="300" r="19" fill="#ffffff" opacity="0.95"/>
    <path d="M466 304 Q472 288 482 299 Q494 291 493 307 H466 Z" fill="#d87524"/>
    <text x="511" y="295" class="white-title">Cloudflare</text>
    <text x="511" y="319" class="white-small">Edge proxy &amp; tunnels</text>
    <text x="464" y="378" class="body-bold">Allowed public ingress</text>
    <text x="464" y="407" class="body">• HTTPS / WSS</text>
    <text x="464" y="434" class="body">• Proxied SSH endpoints</text>
    <line x1="464" y1="456" x2="676" y2="456" class="divider"/>
    <text x="464" y="486" class="small">TLS, WAF, tunnel routing</text>
    <text x="464" y="511" class="small">Origin addresses not published</text>
    <text x="464" y="536" class="small">in public service DNS</text>
    <rect x="464" y="552" width="212" height="22" rx="11" fill="#fff0e3"/>
    <text x="570" y="568" text-anchor="middle" class="tiny" fill="#9b5118">LOGGED EDGE / TUNNEL EVENTS</text>
  </g>

  <g>
    <rect x="440" y="662" width="260" height="156" rx="18" fill="#fff5e8" stroke="#e3b27e" stroke-width="1.5"/>
    <text x="464" y="699" class="card-title">Public Internet</text>
    <text x="464" y="731" class="body">Dedicated VM public IPs</text>
    <text x="464" y="758" class="body-bold">SSH + outbound Internet</text>
    <text x="464" y="785" class="small">No private path to CoCalc VPCs</text>
  </g>

  <g>
    <rect x="440" y="852" width="260" height="90" rx="16" fill="#eef3f8" stroke="#b9c9d9" stroke-width="1.5"/>
    <text x="464" y="886" class="card-title">Google Cloud APIs</text>
    <text x="464" y="913" class="small">IAM-scoped lifecycle control</text>
    <text x="464" y="934" class="tiny">API calls are not VPC connectivity</text>
  </g>

  <!-- Actor flows -->
  <path d="M340 325 H425" class="flow"/>
  <text x="382" y="312" text-anchor="middle" class="flow-label">HTTPS</text>
  <path d="M340 512 H425" class="flow-dashed"/>
  <text x="382" y="499" text-anchor="middle" class="flow-label">ADMIN</text>
  <path d="M340 740 H425" class="flow-orange"/>
  <text x="382" y="727" text-anchor="middle" class="flow-label" fill="#a85217">SSH</text>

  <!-- GCP trust boundary -->
  <g filter="url(#shadow)">
    <rect x="775" y="184" width="965" height="790" rx="24" fill="#ffffff" stroke="#bfcac4" stroke-width="2.5"/>
  </g>
  <text x="807" y="216" class="section">GOOGLE CLOUD PLATFORM • FOUR INDEPENDENT GCP PROJECTS</text>
  <text x="807" y="239" class="small">Separate IAM • Separate VPCs • No Shared VPC, peering, or private cross-project routes</text>

  <!-- Production core project -->
  <g>
    <rect x="810" y="252" width="895" height="220" rx="20" fill="#f3f7f6" stroke="#236353" stroke-width="2.5"/>
    <rect x="810" y="252" width="12" height="220" rx="6" fill="#236353"/>
    <text x="842" y="286" class="card-subtitle" fill="#236353">GCP PROJECT • PROJECT-HOSTS • PRODUCTION</text>
    <text x="842" y="316" class="card-title">CoCalc production core</text>

    <rect x="842" y="338" width="238" height="105" rx="14" fill="#ffffff" stroke="#bed1ca"/>
    <text x="862" y="369" class="body-bold">Bay / hub control plane</text>
    <text x="862" y="396" class="small">Auth, API, Conat, Postgres</text>
    <text x="862" y="420" class="small">Production identities &amp; state</text>

    <rect x="1106" y="338" width="250" height="105" rx="14" fill="#ffffff" stroke="#bed1ca"/>
    <text x="1126" y="369" class="body-bold">Project hosts</text>
    <text x="1126" y="396" class="small">Customer project workloads</text>
    <text x="1126" y="420" class="small">Isolated project containers</text>

    <rect x="1382" y="338" width="288" height="105" rx="14" fill="#ffffff" stroke="#bed1ca"/>
    <text x="1402" y="369" class="body-bold">Production storage/services</text>
    <text x="1402" y="396" class="small">Host storage + managed backups</text>
    <text x="1402" y="420" class="small">Production credentials only</text>
  </g>

  <!-- Dedicated VM project -->
  <g>
    <rect x="810" y="510" width="895" height="190" rx="20" fill="#fff8ee" stroke="#c36a20" stroke-width="2.5"/>
    <rect x="810" y="510" width="12" height="190" rx="6" fill="#c36a20"/>
    <text x="842" y="544" class="card-subtitle" fill="#a55318">GCP PROJECT • COCALC-AI-PROD-DEDICATED-VMS</text>
    <text x="842" y="574" class="card-title">User-dedicated compute VMs</text>

    <rect x="842" y="596" width="244" height="78" rx="14" fill="#ffffff" stroke="#e5c19e"/>
    <text x="862" y="626" class="body-bold">Default-deny VPC</text>
    <text x="862" y="651" class="small">No cross-project routes</text>

    <rect x="1111" y="596" width="260" height="78" rx="14" fill="#ffffff" stroke="#e5c19e"/>
    <text x="1131" y="626" class="body-bold">No east-west traffic</text>
    <text x="1131" y="651" class="small">VM-to-VM communication denied</text>

    <rect x="1396" y="596" width="274" height="78" rx="14" fill="#ffffff" stroke="#e5c19e"/>
    <text x="1416" y="626" class="body-bold">Outside network only</text>
    <text x="1416" y="651" class="small">Public IP; no private prod/VM path</text>
  </g>

  <!-- Operations project -->
  <g>
    <rect x="810" y="738" width="425" height="200" rx="20" fill="#f1f5fa" stroke="#35658d" stroke-width="2.5"/>
    <rect x="810" y="738" width="12" height="200" rx="6" fill="#35658d"/>
    <text x="842" y="772" class="card-subtitle" fill="#35658d">GCP PROJECT • COCALC-OPS</text>
    <text x="842" y="806" class="card-title">Production operations</text>
    <text x="842" y="842" class="body-bold">alpha.cocalc.ai</text>
    <text x="842" y="869" class="small">Cluster management only</text>
    <text x="842" y="894" class="small">Uses public authenticated endpoints</text>
    <text x="842" y="918" class="small">and GCP APIs; no private prod route</text>
  </g>

  <!-- Development project -->
  <g>
    <rect x="1280" y="738" width="425" height="200" rx="20" fill="#f4f8ee" stroke="#647e3d" stroke-width="2.5"/>
    <rect x="1280" y="738" width="12" height="200" rx="6" fill="#647e3d"/>
    <text x="1312" y="772" class="card-subtitle" fill="#647e3d">GCP PROJECT • COCALC-DEV</text>
    <text x="1312" y="806" class="card-title">Non-production</text>
    <text x="1312" y="842" class="body-bold">Staging + 3 development VMs</text>
    <text x="1312" y="869" class="small">Test identities and test data</text>
    <text x="1312" y="894" class="small">Independent IAM and VPC</text>
    <text x="1312" y="918" class="small">No private production/ops route</text>
  </g>

  <!-- Allowed ingress flows -->
  <path d="M700 330 H790" class="flow"/>
  <text x="745" y="316" text-anchor="middle" class="flow-label">APP</text>
  <path d="M700 752 H790 V605 H810" class="flow-orange"/>
  <text x="750" y="739" text-anchor="middle" class="flow-label" fill="#a85217">PUBLIC IP</text>
  <path d="M700 486 H750 V838 H810" class="flow-dashed"/>
  <text x="744" y="824" text-anchor="middle" class="flow-label">OPS</text>
  <path d="M700 535 H750 V960 H1492 V938" class="flow-dashed"/>
  <text x="1450" y="956" text-anchor="end" class="flow-label">STAGING / DEV</text>

  <!-- Cross-project deny indicators -->
  <g>
    <line x1="1204" y1="486" x2="1222" y2="504" class="deny"/>
    <line x1="1222" y1="486" x2="1204" y2="504" class="deny"/>
    <text x="1234" y="500" class="deny-label">NO PRIVATE ROUTE / PEERING</text>
  </g>
  <g>
    <line x1="1248" y1="825" x2="1266" y2="843" class="deny"/>
    <line x1="1266" y1="825" x2="1248" y2="843" class="deny"/>
    <text x="1257" y="862" text-anchor="middle" class="deny-label">NO TRUST</text>
  </g>

  <!-- Monitoring and evidence -->
  <g filter="url(#shadow)">
    <rect x="58" y="1012" width="1682" height="206" rx="22" fill="#172a24"/>
  </g>
  <text x="88" y="1052" class="section" fill="#a9c9bd">SEGREGATION CONTROLS &amp; AUDIT EVIDENCE</text>

  <g>
    <text x="88" y="1090" class="white-title">Network boundaries</text>
    <text x="88" y="1121" class="white-small">• Separate GCP projects and VPCs</text>
    <text x="88" y="1148" class="white-small">• No Shared VPC or VPC peering</text>
    <text x="88" y="1175" class="white-small">• No corporate private-network trust</text>
  </g>
  <line x1="485" y1="1080" x2="485" y2="1186" stroke="#466259"/>
  <g>
    <text x="520" y="1090" class="white-title">Traffic enforcement</text>
    <text x="520" y="1121" class="white-small">• Explicit Cloudflare public ingress</text>
    <text x="520" y="1148" class="white-small">• Dedicated VM east-west deny</text>
    <text x="520" y="1175" class="white-small">• Project-scoped firewall and IAM rules</text>
  </g>
  <line x1="925" y1="1080" x2="925" y2="1186" stroke="#466259"/>
  <g>
    <text x="960" y="1090" class="white-title">Monitoring evidence</text>
    <text x="960" y="1121" class="white-small">• Cloudflare edge and tunnel logs</text>
    <text x="960" y="1148" class="white-small">• GCP VPC Flow / firewall logs</text>
    <text x="960" y="1175" class="white-small">• GCP Cloud Audit Logs</text>
  </g>
  <line x1="1358" y1="1080" x2="1358" y2="1186" stroke="#466259"/>
  <g>
    <text x="1393" y="1090" class="white-title">Control validation</text>
    <text x="1393" y="1121" class="white-small">• Export firewall and route configs</text>
    <text x="1393" y="1148" class="white-small">• Review denied-flow samples</text>
    <text x="1393" y="1175" class="white-small">• Revalidate after network changes</text>
  </g>

  <text x="64" y="1260" class="small">Target design. Before submission as implemented SOC 2 evidence, complete the two pending migrations and attach current GCP firewall, route, IAM, and flow-log exports.</text>
  <text x="1736" y="1260" text-anchor="end" class="small">SageMath, Inc. • CoCalc</text>
</svg>
